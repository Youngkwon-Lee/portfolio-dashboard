name: Funding Lab verification (paper only)

on:
  pull_request:
    paths:
      - .github/workflows/funding-lab-pr.yml
      - app/**
      - components/**
      - lib/**
      - tests/**
      - scripts/**
      - backend/**
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - tsconfig.json
      - next.config.ts
      - vercel.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funding-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Node tests, TypeScript, production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: Funding calculation regression tests
        run: npm run test:funding
      - name: Type-check application
        run: npm run typecheck
      - name: Build application without deployment
        run: npm run build
      - name: Install Korean font for screenshot legibility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-nanum
          fc-cache -f
          fc-match "sans:lang=ko"
      - name: Install pinned headless browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.1
      - name: Funding Lab headless Chrome UI + public API smoke
        env:
          FUNDING_TEST_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          npm run start -- -p 3100 > "$RUNNER_TEMP/funding-next.log" 2>&1 &
          NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 60); do
            if curl --fail --silent --output /dev/null "$FUNDING_TEST_URL"; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat "$RUNNER_TEMP/funding-next.log"; exit 1; fi
          node scripts/funding-browser-smoke.mjs
      - name: Funding HTTP 422 and 429 integration (isolated synthetic upstream)
        env:
          CI: "true"
          FUNDING_GUARD_HTTP_URL: http://127.0.0.1:3101
        run: |
          set -euo pipefail
          FUNDING_ROUTE_FIXTURE_MODE=offline-422 \
          NODE_OPTIONS="--require=$(pwd)/scripts/funding-route-422-preload.cjs" \
          node node_modules/next/dist/bin/next start -p 3101 > "$RUNNER_TEMP/funding-route-guard.log" 2>&1 &
          TEST_PID=$!
          trap 'kill "$TEST_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 60); do
            if curl --fail --silent --output /dev/null "$FUNDING_GUARD_HTTP_URL"; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat "$RUNNER_TEMP/funding-route-guard.log"; exit 1; fi
          node scripts/funding-route-422-http.mjs
          if ! grep -q FUNDING_ROUTE_TEST_UPSTREAM_INTERCEPTED "$RUNNER_TEMP/funding-route-guard.log"; then
            echo "The isolated exchange fixture was not used"; exit 1
          fi

      - name: Upload Funding Lab browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-lab-browser-smoke
          path: funding-ui-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 5

  backend-safety:
    name: Backend paper-only safety regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run isolated backend tests
        env:
          PORTFOLIO_DB_PATH: ${{ runner.temp }}/portfolio-ci.db
          TRADING_SAFETY_STATE_PATH: ${{ runner.temp }}/trading-safety-ci.json
        run: python -m unittest discover -s backend/tests -v

  market-data-smoke:
    name: Hyperliquid 30/90-day public data audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # An upstream outage must not suppress the deterministic safety checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read-only live market-data completeness audit
        run: node --experimental-strip-types scripts/funding-public-smoke.mjs
      - name: Read-only OKX 30/90-day hourly spot/perp and margin audit
        timeout-minutes: 5
        env:
          OKX_AUDIT_COIN: XRP
          OKX_MARK_AUDIT: "1"
        run: node --experimental-strip-types scripts/funding-okx-hourly-audit.mjs
