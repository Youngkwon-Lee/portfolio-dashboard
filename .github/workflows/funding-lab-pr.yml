name: Funding Lab verification (paper only)

on:
  push:
    branches:
      - feat/funding-lab-paper-only-20261016
    paths:
      - .github/workflows/funding-lab-pr.yml
      - app/**
      - components/**
      - lib/**
      - tests/**
      - backend/**
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - tsconfig.json
      - next.config.ts
  pull_request:
    paths:
      - .github/workflows/funding-lab-pr.yml
      - app/**
      - components/**
      - lib/**
      - tests/**
      - backend/**
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - tsconfig.json
      - next.config.ts

permissions:
  contents: read

concurrency:
  group: funding-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Node tests, TypeScript, production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: Funding calculation regression tests
        run: npm run test:funding
      - name: Type-check application
        run: npm run typecheck
      - name: Build application without deployment
        run: npm run build

  backend-safety:
    name: Backend paper-only safety regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run isolated backend tests
        env:
          PORTFOLIO_DB_PATH: ${{ runner.temp }}/portfolio-ci.db
          TRADING_SAFETY_STATE_PATH: ${{ runner.temp }}/trading-safety-ci.json
        run: python -m unittest discover -s backend/tests -v
